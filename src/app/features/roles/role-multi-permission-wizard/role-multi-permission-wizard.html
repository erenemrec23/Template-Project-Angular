<div class="w-full max-w-4xl mx-auto p-4 md:p-6 transition-all duration-150">
  <app-form-header title="PageTitle.Role-multi-permission-wizard"></app-form-header>

  <!-- targetId YOK → çoklu mod (önce rol seçimi) -->
  <app-permission-wizard
    [cancelUrl]="'/roles'"
    [fetchTargets]="fetchTargetsFn"
    [targetLabelFn]="targetLabelFn"
    [targetStepLabel]="'Title.Wizard.SelectRoles'"
    [savePermissions]="saveFn"
    (saved)="onSaved()" />
</div>
