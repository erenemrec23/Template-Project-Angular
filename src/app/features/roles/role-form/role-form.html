<div class="w-full max-w-4xl mx-auto p-4 md:p-6 transition-all duration-150">

  <app-form-header></app-form-header>

  <app-tab-container
    [tabs]="[
      { id: 'general',     label: t('Label.Form') },
      { id: 'permissions', label: t('Label.PageRolePermissions') },
      { id: 'personnel',   label: t('Label.SelectRolePersonnel') }
    ]"
    [value]="activeTab()"
    (valueChange)="activeTab.set($event )" />

  <form app-form-wrapper
        [formGroup]="formGroup"
        [cancelUrl]="returnUrl() || '/roles'"
        [isSubmitting]="isSubmitting()"
        [submitButtonText]="isEditMode() ? t('Button.Update') : t('Button.Save')"
        (ngSubmit)="onSubmit()"
        (onCancel)="onCancel()"
        [readonly]="isViewReadonlyMode()">

    <div [hidden]="activeTab() !== 'general'" class="grid grid-cols-1 gap-4 max-w-xl">
      <app-form-input
        [formGroup]="formGroup"
        controlName="name"
        [label]="t('Label.RoleName')"
        [placeholder]="t('Placeholder.RoleName')"
        [required]="true"
        [readonly]="isViewReadonlyMode()"
        [isSubmitted]="isSubmitting()">
      </app-form-input>
    </div>

    <div [hidden]="activeTab() !== 'permissions'">
      <app-permission-matrix
        [readonly]="isViewReadonlyMode()"
        [targetId]="formGroup.get('id')?.value"
        [fetchPermissions]="rolePermissionFetchFn" 
        (permissionsChange)="onPermissionsCalculated($event)" 
        (groupPermissionsChange)="onGroupPermissionsCalculated($event)"  />
    </div>

    <div [hidden]="activeTab() !== 'personnel'">
      <app-role-personnel-select
        [readonly]="isViewReadonlyMode()"
        [targetId]="formGroup.get('id')?.value"
        [fetchAllPersonnel]="rolePersonnelFetchAllFn"
        [fetchAssignedPersonnel]="rolePersonnelFetchAssignedFn"
        (personnelChange)="onPersonnelCalculated($event)" />
    </div>

  </form>
</div>
