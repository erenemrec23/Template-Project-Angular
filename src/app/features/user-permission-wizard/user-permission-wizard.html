<div class="w-full max-w-4xl mx-auto p-4 md:p-6 transition-all duration-150">
  <app-form-header></app-form-header>

  <!-- @if (userId()) guard KALDIRILDI: id yoksa çoklu (personel seçimi) modu açılır -->
  <app-permission-wizard
    [targetId]="userId()"
    [cancelUrl]="'/users'"
    [fetchPermissions]="fetchFn"
    [fetchTargets]="fetchTargetsFn"
    [targetLabelFn]="targetLabelFn"
    [savePermissions]="saveFn"
    (saved)="onSaved()" />
</div>
