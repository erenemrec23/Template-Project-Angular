<div class="w-full max-w-4xl mx-auto p-4 md:p-6 transition-all duration-150">

  <app-form-header></app-form-header>

  <app-tab-container
    [tabs]="[
      { id: 'general',     label: t('Label.Form') },
      { id: 'permissions', label: t('Label.PageUserPermissions') },
      { id: 'roles',       label: t('Label.AssignRoles') }
    ]"
    [value]="activeTab()"
    (valueChange)="activeTab.set($event)" />

  <form app-form-wrapper
        [formGroup]="formGroup"
        [cancelUrl]="returnUrl() || '/users'"
        [isSubmitting]="isSubmitting()"
        [submitButtonText]="isEditMode() ? t('Button.Update') : t('Button.Save')"
        (ngSubmit)="onSubmit()"
        (onCancel)="onCancel()"
        [readonly]="isViewReadonlyMode()">

    <!-- ================= GENEL BILGILER ================= -->
    <div [hidden]="activeTab() !== 'general'" class="grid grid-cols-1 gap-4 max-w-xl">
      <app-form-input
        [formGroup]="formGroup"
        controlName="firstName"
        [label]="t('Label.FirstName')"
        [placeholder]="t('Placeholder.FirstName')"
        [required]="true"
        [readonly]="isViewReadonlyMode()"
        [isSubmitted]="isSubmitting()">
      </app-form-input>

      <app-form-input
        [formGroup]="formGroup"
        controlName="lastName"
        [label]="t('Label.LastName')"
        [placeholder]="t('Placeholder.LastName')"
        [required]="true"
        [readonly]="isViewReadonlyMode()"
        [isSubmitted]="isSubmitting()">
      </app-form-input>

      <app-form-input
        [formGroup]="formGroup"
        controlName="email"
        type="email"
        [label]="t('Label.Email')"
        [placeholder]="t('Placeholder.Email')"
        [required]="true"
        [readonly]="isViewReadonlyMode()"
        [isSubmitted]="isSubmitting()">
      </app-form-input>

      <!-- Sifre Alani ve Otomatik Sifre Ureticisi -->
      @if (!isEditMode()) {
        <div class="space-y-1">
          <div class="relative flex items-end gap-2">
            <div class="flex-1">
              <app-form-input
                [formGroup]="formGroup"
                controlName="password"
                [type]="showPassword ? 'text' : 'password'"
                [label]="t('Label.Password')"
                [placeholder]="t('Placeholder.Password')"
                [required]="true"
                [readonly]="isViewReadonlyMode()"
                [isSubmitted]="isSubmitting()">
              </app-form-input>
            </div>

            <!-- Aksiyon Butonlari -->
            @if (!isViewReadonlyMode()) {
              <div class="flex items-center gap-1 mb-[2px]">
                <!-- Sifre Uret Butonu -->
                <button
                  type="button"
                  (click)="generatePassword()"
                  class="px-3 py-2 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md border border-slate-300 transition-colors flex items-center gap-1.5 h-[42px]"
                  title="Rastgele Sifre Uret">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 2v6h-6"></path>
                    <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                    <path d="M3 22v-6h6"></path>
                    <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                  </svg>
                  <span>Uret</span>
                </button>

                <!-- Kopyala Butonu -->
                @if (formGroup.get('password')?.value) {
                  <button
                    type="button"
                    (click)="copyPassword()"
                    class="px-2.5 py-2 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md border border-slate-300 transition-colors h-[42px]"
                    title="Kopyala">
                    @if (isCopied) {
                      <span class="text-emerald-600 font-semibold">Kopyalandi!</span>
                    } @else {
                      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                      </svg>
                    }
                  </button>
                }
              </div>
            }
          </div>
        </div>
      }

      <!-- 2FA DURUMU (sadece duzenleme modunda ve 2FA aktifse) -->
@if (isEditMode() && twoFactorEnabled()) {
  <div class="flex items-center justify-between p-4 rounded-lg border border-amber-200 bg-amber-50">
    <div class="flex items-start gap-3">
      <i class="bi bi-shield-lock-fill text-amber-600 text-lg mt-0.5"></i>
      <div>
        <p class="font-medium text-amber-800 text-sm">{{ t('Label.TwoFactorEnabled') }}</p>
        <p class="text-xs text-amber-700">{{ t('Label.AdminTwoFactorDisableHint') }}</p>
      </div>
    </div>
    @if (!isViewReadonlyMode()) {
      <button
        type="button"
        (click)="disableTwoFactor()"
        [disabled]="disabling2fa()"
        class="shrink-0 px-3 py-2 rounded-md bg-red-600 text-white text-xs font-medium hover:bg-red-700 disabled:opacity-50 flex items-center gap-1.5">
        <i class="bi bi-shield-slash"></i>
        {{ disabling2fa() ? t('Button.Processing') : t('Button.DisableTwoFactor') }}
      </button>
    }
  </div>
}
    </div>

    <!-- ================= YETKILER ================= -->
    <div [hidden]="activeTab() !== 'permissions'">
      <app-permission-matrix
        [targetId]="formGroup.get('id')?.value"
        [fetchPermissions]="userPermissionFetchFn"
        [readonly]="isViewReadonlyMode()"
        (permissionsChange)="onPermissionsCalculated($event)"
        (groupPermissionsChange)="onGroupPermissionsCalculated($event)" />
    </div>

    <!-- ================= ROLLER ================= -->
    <div [hidden]="activeTab() !== 'roles'">
      <app-multi-select
        [targetId]="formGroup.get('id')?.value"
        [fetchAll]="roleLookupFetchAllFn"
        [fetchAssigned]="roleAssignedFetchFn"
        [labelFn]="roleLabelFn"
        [readonly]="isViewReadonlyMode()"
        (selectionChange)="onRolesCalculated($event)" />
    </div>

  </form>
</div>
