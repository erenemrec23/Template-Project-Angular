

@if (!twoFactorStep()) {
  <!-- MEVCUT login form'un buraya olduğu gibi -->
  
<div class="bg-white p-10 rounded-2xl shadow-2xl w-[90%] max-w-[420px] box-border transform transition-all animate-modal-scale-up">
  
  <div class="text-center mb-8">
    <h1 class="text-red-600 text-3xl font-extrabold tracking-tight m-0 mb-2 select-none">
      QRAssignment
    </h1>
    <p class="text-slate-400 text-[0.95rem] m-0 font-medium">
      Devam etmek için lütfen giriş yapın
    </p>
  </div>
  
  @if (errorMessage()) {
    <div class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-xl text-xs font-semibold flex items-center gap-2 mb-6 shadow-2xs animate-[fadeIn_0.12s_ease-out]">
      <i class="bi bi-exclamation-triangle-fill text-red-600 text-sm"></i> 
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
    
    <div class="flex flex-col gap-1.5 w-full">
      <label for="email" class="font-semibold text-slate-600 text-xs tracking-wide">
        E-posta Adresi veya Kullanıcı Adı
      </label>
      <div class="relative flex items-center w-full">
        <i class="bi bi-person absolute left-3.5 text-slate-400 text-base pointer-events-none transition-colors"></i>
        <input 
          type="text" 
          id="email" 
          formControlName="userNameOrEmail" 
          placeholder="kullanıcı adı veya e-posta"
          [class]="isFieldInvalid('userNameOrEmail')
            ? 'border-red-500 bg-red-50/50 focus:border-red-500 focus:ring-red-500/15'
            : 'border-slate-300 bg-slate-50/50 text-slate-800 focus:border-red-500 focus:ring-red-500/15 focus:bg-white'"
          class="w-full pl-10 pr-4 py-2.5 border rounded-lg text-[0.95rem] outline-none transition-all duration-150 box-border focus:ring-2" />
      </div>
    </div>

    <div class="flex flex-col gap-1.5 w-full">
      <label for="password" class="font-semibold text-slate-600 text-xs tracking-wide">
        Şifre
      </label>
      <div class="relative flex items-center w-full">
        <i class="bi bi-lock absolute left-3.5 text-slate-400 text-base pointer-events-none transition-colors"></i>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          placeholder="••••••"
          [class]="isFieldInvalid('password')
            ? 'border-red-500 bg-red-50/50 focus:border-red-500 focus:ring-red-500/15'
            : 'border-slate-300 bg-slate-50/50 text-slate-800 focus:border-red-500 focus:ring-red-500/15 focus:bg-white'"
          class="w-full pl-10 pr-4 py-2.5 border rounded-lg text-[0.95rem] outline-none transition-all duration-150 box-border focus:ring-2" />
      </div>
    </div>

    <button type="submit" 
            class="w-full bg-red-600 text-white border-0 py-3 text-[0.95rem] font-bold rounded-xl cursor-pointer transition-all duration-200 flex items-center justify-center gap-2 mt-2 shadow-lg shadow-red-600/15 disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none hover:bg-red-700 hover:-translate-y-0.5 active:translate-y-0 focus:outline-none"
            [disabled]="isSubmitting() || loginForm.invalid">
      @if (isSubmitting()) {
        <i class="bi bi-arrow-clockwise animate-spin text-base"></i> Giriş Yapılıyor...
      } @else {
        <span>Giriş Yap</span> <i class="bi bi-box-arrow-in-right text-base"></i>
      }
    </button>
<div class="text-right -mt-2">
  <a routerLink="/forgot-password" class="text-slate-500 text-xs font-semibold hover:text-red-600 transition-colors no-underline">
    Şifremi unuttum?
  </a>
</div>
  </form>
</div>
} @else {
  <!-- 2FA ADIMI -->
  <div class="space-y-5">
    <p class="text-slate-500 text-sm text-center">
      Authenticator uygulamanızdaki 6 haneli kodu girin.
    </p>
    <input
      type="text" inputmode="numeric" maxlength="6"
      [value]="twoFactorCode()"
      (input)="twoFactorCode.set($any($event.target).value)"
      placeholder="000000"
      class="w-full text-center tracking-[0.5em] font-mono text-lg px-4 py-3 border border-slate-300 rounded-lg outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/15" />

    <button type="button" (click)="verifyTwoFactor()"
      [disabled]="isSubmitting() || twoFactorCode().length < 6"
      class="w-full bg-red-600 text-white border-0 py-3 text-[0.95rem] font-bold rounded-xl cursor-pointer transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-red-600/15 disabled:opacity-60 hover:bg-red-700">
      @if (isSubmitting()) {
        <i class="bi bi-arrow-clockwise animate-spin text-base"></i> Doğrulanıyor...
      } @else {
        <span>Doğrula ve Giriş Yap</span> <i class="bi bi-shield-check text-base"></i>
      }
    </button>

    <button type="button" (click)="backToLogin()"
      class="w-full text-slate-500 text-xs font-semibold hover:text-red-600 transition-colors">
      ← Geri dön
    </button>
  </div>
}
