<!-- Modal Overlay -->
@if (isOpen()) {
  <div class="fixed inset-0 z-[9999] bg-slate-900/65 backdrop-blur-xs flex items-center justify-center p-4 no-screenshot">
    <div class="bg-white rounded-xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="px-5 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50/50">
        <h3 class="text-lg font-bold text-slate-800 m-0">{{ 'Title.SendFeedback' | translate }}</h3>
        <button type="button" (click)="close()" class="text-slate-400 hover:text-slate-600 font-bold text-lg cursor-pointer bg-transparent border-0 p-1">✕</button>
      </div>

      <!-- Body -->
      <div class="p-5 overflow-y-auto flex flex-col gap-4">
        <p class="text-sm text-slate-500 m-0">💡 {{ 'Hint.FeedbackDrawingHint' | translate }}</p>

        <!-- Ekran görüntüsü + çizim -->
        <div class="w-full max-h-[450px] overflow-auto border-2 border-slate-200 rounded-lg bg-slate-50 cursor-crosshair">
          <canvas
            #canvasElement
            class="w-full h-auto block touch-none select-none"
            (pointerdown)="startDrawing($event)"
            (pointermove)="draw($event)"
            (pointerup)="stopDrawing()"
            (pointerleave)="stopDrawing()"
            (pointercancel)="stopDrawing()">
          </canvas>
        </div>

        <!-- Yorum -->
        <div class="flex flex-col gap-1.5">
          <label for="feedback-comment" class="text-sm font-semibold text-slate-700">{{ 'Label.YourComment' | translate }}:</label>
          <textarea
            id="feedback-comment"
            rows="3"
            [placeholder]="'Placeholder.FeedbackComment' | translate"
            [ngModel]="comment()"
            (ngModelChange)="comment.set($event); validationError.set(false)"
            class="w-full p-2.5 border rounded-md text-sm outline-none focus:ring-2 resize-y transition-all text-slate-800"
            [class.border-slate-300]="!validationError()"
            [class.border-red-400]="validationError()">
          </textarea>
          @if (validationError()) {
            <span class="text-xs text-red-500">{{ 'Messages.PleaseWriteComment' | translate }}</span>
          }
        </div>
      </div>

      <!-- Footer -->
      <div class="px-5 py-3 border-t border-slate-200 flex justify-end gap-2.5 bg-slate-50">
        <button type="button" (click)="close()" class="px-4 py-2 text-sm font-medium border border-slate-300 bg-white text-slate-700 rounded-md hover:bg-slate-100 cursor-pointer transition-colors">
          {{ 'Button.Cancel' | translate }}
        </button>
        <button type="button" (click)="save()" class="px-4 py-2 text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-md cursor-pointer transition-colors">
          {{ 'Label.SendOrSave' | translate }}
        </button>
      </div>

    </div>
  </div>
}
