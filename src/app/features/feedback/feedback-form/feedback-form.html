<div class="w-full max-w-4xl mx-auto p-4 md:p-6 transition-all duration-150">

  <app-form-header></app-form-header>

  <form app-form-wrapper
        [formGroup]="formGroup"
        [cancelUrl]="returnUrl() || '/feedbacks'"
        [isSubmitting]="isSubmitting()"
        [submitButtonText]="isEditMode() ? t('Button.Update') : t('Button.Save')"
        (ngSubmit)="onSubmit()"
        (onCancel)="onCancel()"
        [readonly]="isViewReadonlyMode()">

    <div class="grid grid-cols-1 gap-4 max-w-xl">

      <app-form-input
        [formGroup]="formGroup"
        controlName="comment"
        [label]="t('Label.Comment')"
        [placeholder]="t('Placeholder.Comment')"
        [required]="true"
        [readonly]="isViewReadonlyMode()"
        [isSubmitted]="isSubmitting()">
      </app-form-input>

      <app-form-input
        [formGroup]="formGroup"
        controlName="pageUrl"
        [label]="t('Label.PageUrl')"
        [placeholder]="t('Placeholder.PageUrl')"
        [required]="true"
        [readonly]="isViewReadonlyMode()"
        [isSubmitted]="isSubmitting()">
      </app-form-input>

      <app-form-input
        [formGroup]="formGroup"
        controlName="creatorEmail"
        type="email"
        [label]="t('Label.CreatedUserFullName')"
        [placeholder]="t('Placeholder.CreatorEmail')"
        [readonly]="isViewReadonlyMode()"
        [isSubmitted]="isSubmitting()">
      </app-form-input>

    </div>

  </form>
</div>
