<div class="fixed bottom-5 right-5 z-[99999] flex items-center w-full max-w-sm p-4 text-slate-800 bg-white border-l-4 rounded-r-lg shadow-2xl ring-1 ring-black/5 transition-all duration-300 transform translate-x-0 group animate-toast-slide-in"
     [ngClass]="{
       'border-emerald-500': type() === 'success',
       'border-rose-500': type() === 'error'
     }"
     role="alert">
  
  <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg"
       [ngClass]="{
         'text-emerald-500 bg-emerald-50': type() === 'success',
         'text-rose-500 bg-rose-50': type() === 'error'
       }">
    @if (type() === 'success') {
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/>
      </svg>
    } @else {
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3 10.5a1 1 0 1 1-2 0v-3a1 1 0 1 1 2 0v3Zm0 3a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/>
      </svg>
    }
  </div>
  
  <div class="ms-3 text-sm font-medium text-slate-700 max-w-[240px] break-words">
    {{ message() }}
  </div>

  <button (click)="onCloseClick()" 
          type="button" 
          class="ms-auto -mx-1.5 -my-1.5 bg-white text-slate-400 hover:text-slate-900 rounded-lg p-1.5 hover:bg-slate-100 inline-flex items-center justify-center h-8 w-8 opacity-60 group-hover:opacity-100 transition-opacity duration-200 focus:outline-none border-0 cursor-pointer" 
          aria-label="Close">
    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
    </svg>
  </button>
</div>
