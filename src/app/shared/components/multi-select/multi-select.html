<div class="space-y-3">

  <input
    type="text"
    [value]="search()"
    (input)="onSearch($any($event.target).value)"
    [placeholder]="t(searchPlaceholder())"
    class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40" />

  <div class="text-xs text-slate-400">{{ selectedCount() }} {{ t(selectedText()) }}</div>

  <div class="space-y-2 max-h-[50vh] overflow-y-auto pr-1">
    @for (item of filtered(); track getId(item)) {
      <label class="flex items-center gap-3 p-3 rounded-lg border border-slate-200 hover:bg-slate-50 cursor-pointer">
        <input [disabled]="readonly()"
          type="checkbox"
          [checked]="isSelected(getId(item))"
          (change)="toggle(getId(item))"
          class="w-4 h-4 accent-blue-600" />
        <span class="text-sm text-slate-800">{{ getLabel(item) }}</span>
      </label>
    } @empty {
      <div class="text-sm text-slate-400 py-8 text-center">{{ t(emptyText()) }}</div>
    }
  </div>

</div>
