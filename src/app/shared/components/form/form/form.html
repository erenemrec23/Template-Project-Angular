<ng-content></ng-content>

<div class="flex items-center justify-end gap-3 mt-6 pt-6 border-t border-slate-200 w-full">
  
  <app-form-cancel-button [routerLink]="cancelUrl()" (buttonClick)="oncancelClick()"></app-form-cancel-button>
  
  <app-form-submit-button
    [disabled]="formGroup().invalid"
    [isSubmitting]="isSubmitting()"
    [text]="submitButtonText()" 
    [visible]="!readonly()">
  </app-form-submit-button>
  
</div>
