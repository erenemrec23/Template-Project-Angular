<!-- role-personnel-select.html -->
<div class="space-y-5">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 p-4 bg-slate-50 rounded-xl border border-slate-200">
    <div class="relative flex-1 max-w-md">
      <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
      <input
        type="text"
        [placeholder]="t('Placeholder.SearchPersonnel')"
        (input)="searchQuery.set($any($event.target).value)"
        [value]="searchQuery()"
        class="w-full pl-9 pr-3 py-1.5 border border-slate-300 rounded-lg text-sm bg-white outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all placeholder-slate-400 text-slate-800" />
    </div>

    @if (!readonly()) {
      <div class="flex items-center gap-2 shrink-0">
        <button type="button" (click)="selectAll()"
          class="px-3 py-1.5 text-xs font-semibold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-lg transition-colors cursor-pointer flex items-center focus:outline-none">
          <i class="bi bi-check-all text-base mr-1"></i> {{ 'Label.SelectAllPermissions' | translate }}
        </button>
        <button type="button" (click)="clearAll()"
          class="px-3 py-1.5 text-xs font-semibold text-red-700 bg-red-50 hover:bg-red-100 border border-red-200 rounded-lg transition-colors cursor-pointer flex items-center focus:outline-none">
          <i class="bi bi-trash text-sm mr-1.5"></i> {{ 'Label.ClearSelectedRows' | translate }}
        </button>
      </div>
    }
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 max-h-[60vh] overflow-y-auto pr-1">
    @for (person of filteredPersonnel(); track person.id) {
      <label class="flex items-center gap-2 p-2.5 rounded-lg bg-slate-50/50 border border-slate-200 transition-all select-none"
             [class.hover:border-blue-200]="!readonly()"
             [class.hover:bg-white]="!readonly()"
             [class.cursor-pointer]="!readonly()"
             [class.cursor-default]="readonly()"
             [class.opacity-70]="readonly() && !isSelected(person.id)">
        <input
          type="checkbox"
          [checked]="isSelected(person.id)"
          [disabled]="readonly()"
          (change)="toggle(person.id, $event)"
          class="w-4 h-4 rounded text-blue-600 border-slate-300 focus:ring-blue-500 focus:ring-offset-0 cursor-pointer accent-blue-600 disabled:cursor-not-allowed" />
        <!-- değişen tek satır: -->
          <span class="text-xs font-medium text-slate-700">{{ getLabel(person) }}</span>
      </label>
    } @empty {
      <div class="col-span-full text-center py-10 bg-slate-50 border border-dashed border-slate-300 rounded-xl text-sm text-slate-400">
        <i class="bi bi-people text-xl block mb-1.5 text-slate-300"></i> Personel bulunamadı.
      </div>
    }
  </div>
</div>
