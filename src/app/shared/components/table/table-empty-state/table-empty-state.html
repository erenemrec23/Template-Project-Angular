<td colspan="100%" class="p-12 text-center bg-slate-50/50 border-b border-slate-200">
  <div class="flex flex-col items-center justify-center max-w-sm mx-auto gap-3">
    
    <!-- Yuvarlak İkon Kapsayıcısı -->
    <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 border border-slate-200">
      <i class="bi text-xl" [class]="iconClass()"></i>
    </div>
    
    <!-- Bilgilendirme Metinleri -->
    <div class="space-y-1">
      <p class="text-sm font-semibold text-slate-700 m-0">
        {{ messageKey() | translate }}
      </p>
      <p class="text-xs text-slate-400 m-0">
        {{ descriptionKey() | translate }}
      </p>
    </div>

  </div>
</td>
