<div class="relative flex flex-col md:flex-row items-center justify-center p-6 mt-4 border-t border-slate-200 select-none gap-4">
  
  <div class="flex flex-col items-center gap-2">
    <div class="flex items-center gap-1.5">
      
      <button class="flex items-center justify-center w-8 h-8 text-slate-500 rounded-full hover:bg-slate-100 hover:text-slate-900 disabled:opacity-30 disabled:cursor-not-allowed transition-all duration-150 border-0 bg-transparent cursor-pointer" 
              (click)="firstPage()" 
              [disabled]="!hasPrevious()" 
              tooltipPosition="bottom" 
              [appTooltip]="t('Label.FirstPage')">
        <i class="bi bi-chevron-double-left text-sm"></i>
      </button>
      
      <button class="flex items-center justify-center w-8 h-8 text-slate-500 rounded-full hover:bg-slate-100 hover:text-slate-900 disabled:opacity-30 disabled:cursor-not-allowed transition-all duration-150 border-0 bg-transparent cursor-pointer" 
              (click)="previousPage()" 
              [disabled]="!hasPrevious()"  
              tooltipPosition="bottom"  
              [appTooltip]="t('Label.Previous')">
        <i class="bi bi-chevron-left text-sm"></i>
      </button>

      @for (page of visiblePages(); track page) {
        <button 
          [class]="page === pageIndex() 
            ? 'bg-blue-600 text-white font-semibold shadow-md shadow-blue-500/30' 
            : 'text-slate-600 hover:bg-slate-100 bg-transparent'"
          class="flex items-center justify-center w-8 h-8 rounded-full text-[0.9rem] font-medium transition-all duration-150 border-0 cursor-pointer" 
          (click)="goToPage(page)">
          {{ page + 1 }}
        </button>
      }

      <button class="flex items-center justify-center w-8 h-8 text-slate-500 rounded-full hover:bg-slate-100 hover:text-slate-900 disabled:opacity-30 disabled:cursor-not-allowed transition-all duration-150 border-0 bg-transparent cursor-pointer" 
              (click)="nextPage()" 
              [disabled]="!hasNext()" 
              tooltipPosition="bottom" 
              [appTooltip]="t('Label.Next')">
        <i class="bi bi-chevron-right text-sm"></i>
      </button>
      
      <button class="flex items-center justify-center w-8 h-8 text-slate-500 rounded-full hover:bg-slate-100 hover:text-slate-900 disabled:opacity-30 disabled:cursor-not-allowed transition-all duration-150 border-0 bg-transparent cursor-pointer" 
              (click)="lastPage()" 
              [disabled]="!hasNext()" 
              tooltipPosition="bottom" 
              [appTooltip]="t('Label.LastPage')">
        <i class="bi bi-chevron-double-right text-sm"></i>
      </button>
    </div>

    <div class="text-[0.82rem] font-medium text-slate-400 tracking-wide mt-0.5">
      {{ rangeStart() }}-{{ rangeEnd() }} / {{ totalCount() }} {{ t('Label.TotalRecordCount') }}
    </div>
  </div>

  <div class="flex items-center gap-2 md:absolute md:right-0 md:top-6">
    <select class="py-1 px-2.5 border border-slate-300 rounded-md bg-white text-slate-600 outline-none cursor-pointer text-[0.85rem] font-medium focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all" 
            [value]="pageSize()" 
            (change)="onChangePageSize($event)">
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
    <span class="text-[0.85rem] font-medium text-slate-400">{{ t('Label.ItemsPerPage') }}</span>
  </div>

</div>
