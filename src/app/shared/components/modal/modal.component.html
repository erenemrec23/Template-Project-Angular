@if (isOpen()) {
  <div class="fixed inset-0 w-screen h-screen bg-slate-900/40 backdrop-blur-sm flex justify-center items-center z-[9999]" 
       (click)="close()">
    
    <!-- YENİ: max-w-[450px] sabit class'ı kaldırılıp getModalWidthClass() fonksiyonuna bağlandı -->
    <div [class]="'bg-white px-8 pt-6 pb-8 rounded-2xl shadow-2xl w-[90%] transform transition-all animate-modal-scale-up ' + getModalWidthClass()" 
         (click)="$event.stopPropagation()">
      
      <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-3">
        <h3 class="m-0 text-slate-800 text-xl font-semibold tracking-tight">
          {{ title() }}
        </h3>
        <button class="bg-transparent border-0 text-lg text-slate-400 hover:text-slate-800 cursor-pointer p-1 transition-colors duration-150 focus:outline-none" 
                (click)="close()" 
                title="Kapat">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <!-- İçeriği matrisin ve form elemanlarının rahat sığması için sola yasladık -->
      <div class="text-left w-full">
        <ng-content></ng-content>
      </div>

    </div>
  </div>
}
