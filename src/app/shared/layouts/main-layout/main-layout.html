<app-sidebar></app-sidebar>

<!-- Sayfa içeriklerinin yükleneceği alan -->
<!-- mainClasses(): sidebar durumuna göre ml-[72px] <-> ml-60 arasında geçiş yapar -->
<main [class]="mainClasses()">
  <router-outlet></router-outlet>
</main>

<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 11000;">
  <div id="globalErrorToast"
       class="toast align-items-center text-white bg-danger border-0 rounded-[10px] shadow-[0_4px_12px_rgba(224,49,49,0.2)]"
       role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">

      <div class="toast-body d-flex align-items-center gap-2 font-medium p-4">
        <i class="bi bi-exclamation-octagon-fill text-xl"></i>
        <span id="globalErrorToastMessage">Hata mesajı buraya gelecek.</span>
      </div>

      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>
